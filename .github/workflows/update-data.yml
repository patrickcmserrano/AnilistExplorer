name: Update Anime Data

on:
  schedule:
    # Run every week (Sunday at 00:00 UTC)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'scraper/**'

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scraper/requirements.txt'
      
      - name: Install Python dependencies
        run: |
          pip install -r scraper/requirements.txt
      
      - name: Run scraper
        run: |
          cd scraper
          python anilist_scraper.py
        continue-on-error: false
      
      - name: Check for changes
        id: verify-changed-files
        run: |
          if git diff --quiet src/data/anime.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push if changed
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/anime.json
          # Only add cache files if they exist
          [ -f scraper/anime_cache.json ] && git add scraper/anime_cache.json
          [ -f scraper/anilist_enriched_data.json ] && git add scraper/anilist_enriched_data.json
          git commit -m "chore: update anime data - $(date +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git push
      
      - name: Summary
        run: |
          if [ "${{ steps.verify-changed-files.outputs.changed }}" == "true" ]; then
            echo "✅ Anime data updated successfully!"
          else
            echo "ℹ️ No changes detected in anime data."
          fi
